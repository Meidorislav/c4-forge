# Local development environment.
#
# For now it runs PostgreSQL only; the application joins once it has a
# container image (roadmap step 0.4). Use `make db-up` / `make db-down`.
# The credentials below are for local development only.
name: c4forge

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: c4forge
      POSTGRES_PASSWORD: c4forge
      POSTGRES_DB: c4forge
    ports:
      # Bound to localhost only. Override the host port with C4FORGE_DB_PORT
      # if 5432 is taken.
      - "127.0.0.1:${C4FORGE_DB_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U c4forge -d c4forge"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
